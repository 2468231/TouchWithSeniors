# render.yaml — Render deployment configuration
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── Backend (Express + MongoDB) ──────────────────────────────────────────
  - type: web
    name: touchwithseniors-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false          # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false          # Set this manually in Render dashboard
      - key: CLIENT_URL
        sync: false          # e.g. https://your-frontend.vercel.app
    healthCheckPath: /api/health

  # ── Frontend (React + Vite) ───────────────────────────────────────────────
  - type: web
    name: touchwithseniors-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    plan: free
    envVars:
      - key: VITE_API_URL
        sync: false          # e.g. https://touchwithseniors-server.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
