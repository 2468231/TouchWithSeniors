<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0d4ff"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Graduation cap board -->
  <polygon points="32,14 54,24 32,34 10,24" fill="url(#cap)" opacity="0.95"/>
  <!-- Cap tassel line -->
  <rect x="48" y="24" width="2.5" height="12" rx="1.25" fill="white" opacity="0.85"/>
  <circle cx="49.25" cy="38" r="2.5" fill="#fbbf24"/>
  <!-- Body of gown (book/stack lines) -->
  <rect x="21" y="36" width="22" height="3" rx="1.5" fill="white" opacity="0.4"/>
  <path d="M21 36 C21 36 21 50 32 50 C43 50 43 36 43 36" fill="white" opacity="0.18"/>
  <!-- Spark dot top right -->
  <circle cx="52" cy="13" r="3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="12" cy="48" r="2" fill="#a78bfa" opacity="0.7"/>
</svg>